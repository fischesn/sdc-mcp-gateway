[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sdc-mcp-gateway"
version = "0.1.0"
description = "Read-only research prototype for mapping IEEE 11073 SDC state to MCP resources."
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [
  {name = "Stefan Fischer and collaborators"}
]
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "jsonschema>=4.21"
]

[project.optional-dependencies]
mcp = ["mcp>=1.8"]
sdc = ["sdc11073>=2.4.1,<3.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]
all = ["mcp>=1.8", "sdc11073>=2.4.1,<3.0", "pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
sdc-mcp-gateway = "sdc_mcp_gateway.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
