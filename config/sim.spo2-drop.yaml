version: "0.7"
description: "SpO2-drop scenario: peripheral oxygen saturation decreases below the low alarm threshold."
random_seed: 7002
devices:
  - device_id: "sim-monitor-1"
    display_name: "Simulated Patient Monitor - SpO2 Drop"
    manufacturer: "Research Prototype"
    model: "SimMonitor-v0.7"
    location_ref: "simulation-bed-1"
    patient_ref: "simulated-patient-redacted"
    metrics:
      - handle: "metric.hr"
        code: "150456"
        unit: "beats/min"
        baseline: 82
        amplitude: 4
        period_s: 45
        noise: 0.6
        min_value: 35
        max_value: 180
      - handle: "metric.spo2"
        code: "150452"
        unit: "%"
        baseline: 97
        amplitude: 0.6
        period_s: 80
        noise: 0.2
        min_value: 60
        max_value: 100
        events:
          - kind: "ramp"
            start_s: 20
            end_s: 70
            target: 86
            description: "Oxygen saturation gradually falls below the low alarm threshold."
      - handle: "metric.resp_rate"
        code: "151562"
        unit: "1/min"
        baseline: 20
        amplitude: 2
        period_s: 60
        noise: 0.4
        min_value: 5
        max_value: 45
    alarms:
      - handle: "alarm.hr.high"
        code: "alarm.hr.high"
        metric_handle: "metric.hr"
        high_threshold: 120
        priority: "medium"
        kind: "physiological"
      - handle: "alarm.spo2.low"
        code: "alarm.spo2.low"
        metric_handle: "metric.spo2"
        low_threshold: 90
        priority: "high"
        kind: "physiological"
