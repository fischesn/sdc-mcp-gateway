gateway:
  name: "sdc-to-mcp-gateway"
  mode: "read-only"
  log_file: "data/logs/holdout-multidevice-alarm.jsonl"
  expose_raw_mdib: true
  allow_tools: false
  allow_write_operations: false
sdc:
  adapter: "simulated"
  simulation_config: "config/sim.holdout-multidevice-alarm.yaml"
  simulation_elapsed_s: 100.0
  local_ip: "127.0.0.1"
mcp:
  server_name: "sdc-mcp-gateway"
  transport: "stdio"

