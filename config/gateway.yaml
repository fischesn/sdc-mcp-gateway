gateway:
  name: "sdc-to-mcp-gateway"
  mode: "read-only"
  log_file: "data/logs/gateway.jsonl"
  expose_raw_mdib: true
  allow_tools: false
  allow_write_operations: false

sdc:
  adapter: "dummy"        # dummy | sdc11073
  discovery_timeout_s: 5
  local_ip: "127.0.0.1"   # replace with the IPv4 address of the lab network interface for real SDC discovery
  max_devices: 1           # null means: no limit
  provider_whitelist: []   # empty means: accept all discovered providers

mcp:
  server_name: "sdc-mcp-gateway"
  transport: "stdio"      # stdio is the normal local MCP transport
