gateway:
  name: "sdc-to-mcp-gateway"
  mode: "read-only"
  log_file: "data/logs/gateway-simulated.jsonl"
  expose_raw_mdib: true
  allow_tools: false
  allow_write_operations: false

sdc:
  # In-process simulation. This does NOT open a real IEEE 11073 SDC network endpoint.
  # It is intended for gateway, mapping, MCP-resource, and logging development.
  adapter: "simulated"
  simulation_config: "config/sim.combined.yaml"
  simulation_elapsed_s: 0.0
  discovery_timeout_s: 1
  provider_whitelist: []
  local_ip: "127.0.0.1"
  max_devices: null

mcp:
  server_name: "sdc-mcp-gateway"
  transport: "stdio"
