version: "0.3"
description: "Reproducible simulated ventilator scenario for SDC-to-MCP gateway tests."
random_seed: 20701
devices:
  - device_id: "sim-ventilator-1"
    display_name: "Simulated Ventilator"
    manufacturer: "Research Prototype"
    model: "SimVentilator-v0.3"
    location_ref: "simulation-bed-1"
    patient_ref: "simulated-patient-redacted"
    metrics:
      - handle: "metric.fio2"
        code: "oxygen_concentration"
        unit: "%"
        baseline: 35
        amplitude: 2.5
        period_s: 120
        noise: 0.2
        min_value: 21
        max_value: 100
      - handle: "metric.peep"
        code: "peep"
        unit: "cmH2O"
        baseline: 8
        amplitude: 0.5
        period_s: 90
        noise: 0.1
        min_value: 0
        max_value: 25
      - handle: "metric.airway_pressure"
        code: "airway_pressure"
        unit: "cmH2O"
        baseline: 22
        amplitude: 4
        period_s: 12
        noise: 0.5
        min_value: 0
        max_value: 60
    alarms:
      - handle: "alarm.airway_pressure.high"
        code: "alarm.airway_pressure.high"
        metric_handle: "metric.airway_pressure"
        high_threshold: 40
        priority: "high"
        kind: "physiological"
